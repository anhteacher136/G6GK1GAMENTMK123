<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn thi giữa kì I – Tiếng Anh 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#E6F3FB; --surface:#FFFFFF; --surface2:#F3F9FD; --ink:#14304A; --muted:#587089; --line:#C6DCEA; --press:#BCD3E3;
  --sun:#FFC83D; --sun-ink:#4A3300; --good:#239A5B; --good-bg:#DDF5E7; --bad:#D9363E; --bad-bg:#FDE3E3;
  --u1:#2F7DE1; --u2:#E8770F; --u3:#7C4FE8;
  --u1-bg:#E1EDFC; --u2-bg:#FDEBDA; --u3-bg:#ECE4FD;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E2131; --surface:#173149; --surface2:#1D3A55; --ink:#EAF4FC; --muted:#9DB5CA; --line:#2B4C69; --press:#08182A;
    --good:#4BCB86; --good-bg:#14402B; --bad:#FF6B71; --bad-bg:#4A1C20;
    --u1:#6EA8F5; --u2:#FFA052; --u3:#A887FF;
    --u1-bg:#1A3858; --u2-bg:#46301B; --u3-bg:#2F2756;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E2131; --surface:#173149; --surface2:#1D3A55; --ink:#EAF4FC; --muted:#9DB5CA; --line:#2B4C69; --press:#08182A;
  --good:#4BCB86; --good-bg:#14402B; --bad:#FF6B71; --bad-bg:#4A1C20;
  --u1:#6EA8F5; --u2:#FFA052; --u3:#A887FF;
  --u1-bg:#1A3858; --u2-bg:#46301B; --u3-bg:#2F2756;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--u1);outline-offset:3px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 40px}
.hidden{display:none!important}

/* chunky pressable */
.btn{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 18px;font-weight:700;box-shadow:0 4px 0 var(--press);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--press)}
.btn.primary{background:var(--sun);color:var(--sun-ink);border-color:#E8AE14;box-shadow:0 5px 0 #C48F00;font-size:22px;padding:12px 28px}
.btn.primary:active{box-shadow:0 2px 0 #C48F00}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--muted)}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.brand{font-weight:700;color:var(--muted);font-size:16px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:20px;box-shadow:0 3px 0 var(--press)}

/* setup */
h1{font-size:clamp(34px,7vw,52px);line-height:1.02;margin:12px 0 6px;font-weight:800;letter-spacing:-.5px}
.lead{color:var(--muted);margin:0 0 22px;max-width:52ch}
.units{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.unit{position:relative;text-align:left;border:3px solid var(--line);background:var(--surface);border-radius:22px;padding:14px 14px 12px;box-shadow:0 5px 0 var(--press);transition:transform .08s}
.unit:active{transform:translateY(3px)}
.unit .em{font-size:34px;line-height:1}
.unit .n{display:block;font-weight:800;font-size:15px;margin-top:6px;opacity:.8}
.unit .t{display:block;font-weight:800;font-size:20px;line-height:1.1}
.unit .c{display:block;font-size:14px;color:var(--muted)}
.unit .tick{position:absolute;top:10px;right:12px;width:26px;height:26px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-size:15px;font-weight:800}
.unit[aria-pressed="true"] .tick{color:#fff}
.unit[data-u="1"][aria-pressed="true"]{border-color:var(--u1);background:var(--u1-bg);box-shadow:0 5px 0 var(--u1)}
.unit[data-u="2"][aria-pressed="true"]{border-color:var(--u2);background:var(--u2-bg);box-shadow:0 5px 0 var(--u2)}
.unit[data-u="3"][aria-pressed="true"]{border-color:var(--u3);background:var(--u3-bg);box-shadow:0 5px 0 var(--u3)}
.unit[data-u="1"][aria-pressed="true"] .tick{background:var(--u1);border-color:var(--u1)}
.unit[data-u="2"][aria-pressed="true"] .tick{background:var(--u2);border-color:var(--u2)}
.unit[data-u="3"][aria-pressed="true"] .tick{background:var(--u3);border-color:var(--u3)}

.group{margin-bottom:18px}
.group h2{font-size:19px;margin:0 0 8px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;font-weight:700;box-shadow:0 3px 0 var(--press)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:0 3px 0 var(--press)}
.chip small{font-weight:600;opacity:.75}
.startrow{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:26px}
.note{color:var(--muted);font-size:15px}
.voicerow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.who{display:flex;flex-wrap:wrap;gap:10px}
.who input{font:inherit;font-weight:700;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 14px;flex:2 1 200px;min-width:0;box-shadow:0 3px 0 var(--press)}
.who input#stClass{flex:1 1 110px}
.who input::placeholder{color:var(--muted);font-weight:600}
.who input.need{border-color:var(--bad)}
.send{font-weight:700;border-radius:14px;padding:8px 12px;background:var(--surface2);color:var(--muted);display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.send.ok{background:var(--good-bg);color:var(--good)}
.send.no{background:var(--bad-bg);color:var(--bad)}
#voiceSel{font:inherit;font-weight:700;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 12px;max-width:100%;min-width:0;flex:1 1 220px;box-shadow:0 3px 0 var(--press)}
#voiceNote:empty{display:none}

/* game */
.hud{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.track{flex:1;height:18px;border-radius:999px;background:var(--surface);border:2px solid var(--line);position:relative;overflow:visible}
.track .fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:999px;background:var(--good);transition:width .35s}
.track .runner{position:absolute;top:50%;left:0;transform:translate(-50%,-55%);font-size:26px;transition:left .35s;filter:drop-shadow(0 2px 0 var(--press))}
.stat{font-weight:800;font-size:18px;min-width:56px;text-align:right;white-space:nowrap}
.streak{color:var(--u2)}
.teams{display:flex;gap:10px;margin-bottom:10px}
.team{flex:1;border:3px solid var(--line);border-radius:16px;padding:6px 12px;background:var(--surface);display:flex;justify-content:space-between;align-items:center;font-weight:800}
.team.on.a{border-color:var(--u1);background:var(--u1-bg)}
.team.on.b{border-color:var(--u2);background:var(--u2-bg)}
.team .sc{font-size:24px}

.card{background:var(--surface);border:3px solid var(--line);border-radius:28px;padding:22px 18px 20px;box-shadow:0 6px 0 var(--press);position:relative}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.tag{font-size:14px;font-weight:800;padding:2px 12px;border-radius:999px;color:#fff}
.tag.u1{background:var(--u1)} .tag.u2{background:var(--u2)} .tag.u3{background:var(--u3)}
.qnum{color:var(--muted);font-weight:700;font-size:15px}
.timer{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden;margin:4px 0 14px}
.timer i{display:block;height:100%;width:100%;background:var(--sun);transition:width .1s linear}
.timer.low i{background:var(--bad)}
.ask{color:var(--muted);font-weight:700;margin:0;text-align:center}
.prompt{display:flex;align-items:center;justify-content:center;gap:12px;min-height:96px;text-align:center;margin:4px 0 16px}
.word{font-size:clamp(30px,7.5vw,50px);font-weight:800;line-height:1.08;word-break:break-word}
.word.vi{font-size:clamp(26px,6vw,40px)}
.speak{flex:none;width:56px;height:56px;border-radius:50%;border:3px solid var(--line);background:var(--surface2);font-size:24px;box-shadow:0 3px 0 var(--press)}
.speak.big{width:110px;height:110px;font-size:46px;border-color:var(--u1);background:var(--u1-bg);box-shadow:0 6px 0 var(--u1)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:3px solid var(--line);background:var(--surface);border-radius:18px;padding:12px 14px;min-height:70px;font-weight:700;font-size:19px;line-height:1.2;box-shadow:0 4px 0 var(--press);transition:transform .08s}
.opt:active{transform:translateY(3px)}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;background:var(--surface2);border:2px solid var(--line);display:grid;place-items:center;font-size:15px;color:var(--muted)}
.opt.right{border-color:var(--good);background:var(--good-bg);box-shadow:0 4px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 4px 0 var(--bad);animation:shake .35s}
.opt:disabled{cursor:default}
.opt.dim{opacity:.45}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:6px 0 18px}
.slot{width:40px;height:50px;border-radius:12px;border:3px dashed var(--line);background:var(--surface2);display:grid;place-items:center;font-size:26px;font-weight:800;padding:0}
.slot.filled{border-style:solid;border-color:var(--u1);background:var(--u1-bg)}
.slot.gap{width:16px;border:none;background:none}
.slot.dash{width:16px;border:none;background:none;font-size:26px}
.slots.right .slot.filled{border-color:var(--good);background:var(--good-bg)}
.slots.wrong .slot.filled{border-color:var(--bad);background:var(--bad-bg)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.tile{width:48px;height:52px;border-radius:14px;border:2px solid #E8AE14;background:var(--sun);color:var(--sun-ink);font-size:26px;font-weight:800;box-shadow:0 4px 0 #C48F00;padding:0}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 #C48F00}
.tile.used{visibility:hidden}
.spellbar{display:flex;justify-content:center;gap:10px;margin-top:16px}

.feedback{margin-top:16px;border-radius:18px;padding:12px 16px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.feedback.ok{background:var(--good-bg);color:var(--good)}
.feedback.no{background:var(--bad-bg);color:var(--bad)}
.feedback .ans{color:var(--ink);font-weight:600}
.feedback .ans b{font-weight:800}

/* end */
.result{text-align:center}
.stars{font-size:56px;letter-spacing:6px;margin:6px 0}
.big{font-size:64px;font-weight:800;line-height:1}
.sub{color:var(--muted)}
.winner{font-size:30px;font-weight:800;margin:6px 0}
.misses{text-align:left;margin-top:20px}
.misses h2{font-size:20px;margin:0 0 8px}
.mlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.mlist li{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:12px;padding:6px 10px}
.mlist .en{font-weight:800}
.mlist .vi{color:var(--muted);flex:1}
.mini{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:16px;flex:none}
.endbtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}

/* word list */
.dlg{position:fixed;inset:0;background:rgba(10,25,40,.55);display:grid;place-items:center;padding:16px;z-index:20}
.dlg .panel{background:var(--surface);color:var(--ink);border-radius:24px;max-width:680px;width:100%;max-height:86vh;display:flex;flex-direction:column;border:3px solid var(--line)}
.dlg .ph{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:2px solid var(--line)}
.dlg .ph h2{margin:0;font-size:22px}
.dlg .pb{overflow:auto;padding:10px 18px 18px}
.dlg h3{margin:14px 0 6px;font-size:18px}
.wl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 14px}
.wl div{display:flex;gap:8px;align-items:baseline;padding:3px 0;border-bottom:1px solid var(--line);font-size:16px}
.wl b{font-weight:800}
.wl span{color:var(--muted)}

@media (max-width:540px){
  .units{grid-template-columns:1fr}
  .unit{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center}
  .unit .em{grid-row:span 3}
  .unit .n{margin-top:0}
  .opts{grid-template-columns:1fr}
  .opt{min-height:58px}
  .slot{width:32px;height:44px;font-size:22px}
  .tile{width:42px;height:48px;font-size:23px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}


.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:22px}
.sec{text-align:left;border:3px solid var(--line);background:var(--surface);border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 var(--press);display:flex;align-items:center;gap:10px;font-weight:800;line-height:1.15}
.sec .em{font-size:26px}
.sec small{display:block;font-weight:600;color:var(--muted);font-size:13px}
.sec[aria-pressed="true"]{border-color:var(--u1);background:var(--u1-bg);box-shadow:0 4px 0 var(--u1)}
.sec[aria-pressed="false"]{opacity:.6}
.tag.sec-tag{background:var(--ink);color:var(--bg)}
.sentence{font-size:clamp(22px,4.6vw,30px);font-weight:700;line-height:1.45;text-align:center;margin:6px 0 18px}
.sentence .blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--ink);margin:0 4px;color:var(--good)}
.sentence u{text-decoration-thickness:3px;text-underline-offset:5px}
.sentence sup{font-size:.55em;font-weight:800;color:var(--u1);margin-left:2px}
.dialog-line{display:block;text-align:left;max-width:560px;margin:0 auto}
.opt u{text-decoration-thickness:3px;text-underline-offset:4px}
.vi-hint{text-align:center;color:var(--muted);font-weight:700;margin:-4px 0 12px}
.build{min-height:64px;border:3px dashed var(--line);border-radius:18px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-bottom:14px;background:var(--surface2)}
.build.right{border-style:solid;border-color:var(--good);background:var(--good-bg)}
.build.wrong{border-style:solid;border-color:var(--bad);background:var(--bad-bg)}
.chunk{border:2px solid #E8AE14;background:var(--sun);color:var(--sun-ink);border-radius:14px;padding:6px 14px;font-weight:800;font-size:20px;box-shadow:0 4px 0 #C48F00}
.chunk.placed{background:var(--surface);color:var(--ink);border-color:var(--u1);box-shadow:0 3px 0 var(--u1)}
.chunk.used{visibility:hidden}
.chunks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ex{display:block;width:100%;color:var(--ink);font-weight:600;font-size:16px;margin-top:4px}
.grade{font-size:84px;font-weight:800;line-height:1}
.grade small{font-size:32px;color:var(--muted)}
.breakdown{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:16px 0 4px;text-align:left}
.breakdown div{background:var(--surface2);border-radius:14px;padding:8px 12px;font-weight:700}
.breakdown b{display:block;font-size:22px}
.wrongq{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.wrongq li{background:var(--surface2);border-radius:14px;padding:10px 12px;font-size:16px}
.wrongq .wq{font-weight:700}
.wrongq .wa{color:var(--good);font-weight:800}
.wrongq .wx{color:var(--muted)}

.passage{background:var(--surface2);border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin:0 0 14px;font-size:16px;line-height:1.55;max-height:240px;overflow:auto;text-align:left}
.passage summary{font-weight:800;cursor:pointer;color:var(--u1)}
.passage p{margin:8px 0 0}
.typebox{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.typebox input{font:inherit;font-size:22px;font-weight:700;color:var(--ink);background:var(--surface);border:3px solid var(--line);border-radius:16px;padding:10px 14px;flex:1 1 260px;min-width:0;max-width:100%}
.typebox input.right{border-color:var(--good);background:var(--good-bg)}
.typebox input.wrong{border-color:var(--bad);background:var(--bad-bg)}
.src{font-size:13px;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--sun);color:var(--sun-ink)}
.opt .k{font-weight:800}
.lead b{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="brand">Tiếng Anh Cô Ánh</span>
    <div style="display:flex;gap:8px">
      <button class="iconbtn" id="soundBtn" aria-label="Bật/tắt âm thanh">🔊</button>
      <button class="iconbtn" id="homeBtn" aria-label="Về màn hình chính">🏠</button>
    </div>
  </header>

  <section id="setup">
    <h1>Ôn thi<br>giữa kì I</h1>
    <p class="lead">Tiếng Anh 6, Unit 1 – Unit 3. Bám sát <b>đề cương THCS Nguyễn Thị Minh Khai 2026 – 2027</b>, có thêm câu luyện tập và giải thích từng câu.</p>

    <div class="group">
      <h2>Thông tin học sinh</h2>
      <div class="who">
        <input id="stName" placeholder="Họ và tên" autocomplete="name" maxlength="40" aria-label="Họ và tên">
        <input id="stClass" placeholder="Lớp (vd: 6A1)" maxlength="12" aria-label="Lớp">
      </div>
    </div>
    <div class="group">
      <h2>Kiểu đề</h2>
      <div class="chips" data-set="count">
        <button class="chip" data-v="dc" aria-pressed="true">📄 Làm hết đề cương <small id="dcCount"></small></button>
        <button class="chip" data-v="30" aria-pressed="false">🎲 Đề ngẫu nhiên 30 câu</button>
        <button class="chip" data-v="40" aria-pressed="false">🎲 Đề ngẫu nhiên 40 câu</button>
      </div>
      <p class="note" id="modeNote"></p>
    </div>
    <div class="group">
      <h2>Phần ôn tập</h2>
      <div class="secs" id="secs"></div>
    </div>
    <div class="group">
      <h2>Thêm</h2>
      <div class="chips"><button class="chip" id="timerChip" aria-pressed="false">⏱️ Tính giờ mỗi câu</button></div>
    </div>
    <div class="group" id="voiceGroup">
      <h2>Giọng đọc Anh – Anh</h2>
      <div class="voicerow">
        <select id="voiceSel" aria-label="Chọn giọng đọc"></select>
        <button class="btn" id="voiceTest">🔈 Nghe thử</button>
      </div>
      <p class="note" id="voiceNote"></p>
    </div>
    <div class="startrow"><button class="btn primary" id="startBtn">Bắt đầu làm bài</button></div>
    <p class="note" id="bestNote"></p>
  </section>

  <section id="game" class="hidden">
    <div class="hud">
      <div class="track" aria-hidden="true"><div class="fill" id="fill"></div><div class="runner" id="runner">🏃</div></div>
      <span class="stat streak" id="streak"></span>
      <span class="stat" id="score"></span>
    </div>
    <div class="card">
      <div class="qmeta"><span><span class="tag sec-tag" id="secTag"></span> <span id="srcTag"></span></span><span class="qnum" id="qnum"></span></div>
      <div class="timer hidden" id="timer"><i id="timerBar"></i></div>
      <p class="ask" id="ask"></p>
      <div id="prompt"></div>
      <div id="answerArea"></div>
      <div id="feedback"></div>
    </div>
  </section>

  <section id="end" class="hidden"><div class="card result" id="resultCard"></div></section>
</div>

<script>
const DATA = {

    .replace(/'m\b/g," am").replace(/'re\b/g," are").replace(/\b(it|he|she|what|that|there)'s\b/g,"$1 is")
    .replace(/favorite/g,"favourite").replace(/[.,!?;:"]/g," ").replace(/\s+/g," ").trim();
}

/* voice */
const canSpeak="speechSynthesis" in window; let enVoice=null, allVoices=[];
const GOOD_GB=/sonia|libby|maisie|ryan|thomas|abbi|bella|hollie|olivia|google uk english|serena|daniel|kate|stephanie|martha|arthur|oliver|jamie|hazel|george|susan/i;
function voiceScore(v){ let s=0; if(/en[-_]GB/i.test(v.lang)) s+=100; else if(/^en/i.test(v.lang)) s+=10; else return -1;
  if(/natural|neural|online|premium|enhanced/i.test(v.name)) s+=40; if(GOOD_GB.test(v.name)) s+=25;
  if(/female|sonia|libby|maisie|serena|kate|stephanie|martha|hazel|susan/i.test(v.name)) s+=5; if(v.localService===false) s+=3; return s; }
function pickVoice(){ if(!canSpeak) return;
  allVoices=speechSynthesis.getVoices().filter(v=>voiceScore(v)>=0).sort((a,b)=>voiceScore(b)-voiceScore(a));
  const gb=allVoices.filter(v=>/en[-_]GB/i.test(v.lang)); const list=gb.length?gb:allVoices;
  const saved=store.get("tv6-voice"); enVoice=list.find(v=>v.name===saved)||list[0]||null;
  $("#voiceSel").innerHTML=list.map(v=>`<option value="${v.name}" ${enVoice&&v.name===enVoice.name?"selected":""}>${v.name.replace(/Microsoft |Google /,"").replace(/ - English \(United Kingdom\)/,"")}${/en[-_]GB/i.test(v.lang)?" (UK)":" ("+v.lang+")"}</option>`).join("")||`<option>Thiết bị chưa có giọng tiếng Anh</option>`;
  $("#voiceNote").textContent=gb.length?"":"Thiết bị này chưa có giọng Anh – Anh, đang dùng giọng tiếng Anh khác."; }
function say(t){ if(!canSpeak||!t) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang="en-GB"; u.rate=0.85; if(enVoice) u.voice=enVoice; speechSynthesis.speak(u);}catch(e){} }
let actx=null;
function beep(ok){ if(!S.sound) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  (ok?[660,880]:[300,220]).forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=ok?"triangle":"sawtooth";o.frequency.value=f;const t=actx.currentTime+i*0.11;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(ok?0.18:0.08,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+0.18);}); }catch(e){} }

/* question objects */
function blanks(q){ return q.replace(/___/g,'<span class="blank">&nbsp;</span>'); }
function fillSay(q,opt){ const parts=strip(opt).split(/\s*\/\s*/); let i=0; return strip(q.replace(/___/g,()=>parts[Math.min(i++,parts.length-1)])); }
function toQ(b, keepOrder){
  const base={s:b.s,src:b.src||"ex",b,ex:b.ex||""};
  if(b.s==="vocab"){ const w=b.w; const ds=[]; const seen=new Set([w.vi]);
    for(const x of shuffle(WORDS.filter(x=>x!==w&&x.u===w.u))){ if(!seen.has(x.vi)){seen.add(x.vi);ds.push(x.vi);} if(ds.length===3) break; }
    return {...base,t:"mc",ask:SEC.vocab.ask,prompt:`<div class="prompt"><span class="word">${w.en}</span><button class="speak" data-say="${w.en}" aria-label="Nghe">🔈</button></div>`,opts:[w.vi,...ds],a:0,ex:`${w.en} = ${w.vi}`,sayFirst:w.en,sayAfter:w.en,label:w.en,fixed:false}; }
  if(b.s==="order"){ const ans=b.w.join(" ").replace(/ ([.?])/,"$1")+b.end; return {...base,t:"order",ask:SEC.order.ask,label:b.vi?`“${b.vi}”`:b.w.join(" / "),ansText:ans,sayAfter:ans}; }
  if(b.s==="verb") return {...base,t:"type",ask:SEC.verb.ask,prompt:`<div class="sentence">${blanks(b.q)}</div>`,ans:b.ans,pre:"",ansText:b.ans[0].replace(/'/g,"’"),label:strip(b.q),sayAfter:strip(b.q.replace("___",b.ans[0])).replace(/\s*\([^)]*\)/,"")};
  if(b.s==="rewrite") return {...base,t:"type",ask:b.pre?"Viết lại câu sao cho nghĩa không đổi":"Viết lại câu, thêm từ trong ngoặc",prompt:`<div class="sentence">${b.q}</div>`,ans:b.ans,pre:b.pre,ansText:b.ans[0].replace(/'/g,"’"),label:strip(b.q),sayAfter:b.ans[0]};
  if(b.s==="phon"||b.s==="stress") return {...base,t:"mc",ask:SEC[b.s].ask,prompt:"",opts:b.o,a:b.a,fixed:keepOrder,label:b.o.map(strip).join(" / "),sayAfter:b.o.map(strip).join(", ")};
  if(b.s==="read"){ const P=PASSAGES[b.psg];
    return {...base,t:"mc",ask:b.psg===3?"Đọc đoạn văn: câu sau Đúng hay Sai?":(b.psg===1?"Đọc đoạn văn và chọn từ điền vào chỗ trống":SEC.read.ask),
      prompt:`<details class="passage" open><summary>${P.t}</summary>${P.h}</details><div class="sentence">${blanks(b.q)}</div>`,opts:b.o,a:b.a,fixed:true,label:`[${P.t}] ${strip(b.q)}`}; }
  // mcq, sent
  const q=b.q||"";
  const isDialog=q.includes("<br>");
  const prompt=`<div class="sentence">${isDialog?q.split("<br>").map(l=>`<span class="dialog-line">${blanks(l)}</span>`).join(""):blanks(q)}</div>`;
  const sayA = b.s==="sent" ? strip(b.o[b.a]) : (q.includes("___")?fillSay(q,b.o[b.a]):strip(b.o[b.a]));
  return {...base,t:"mc",ask:b.askOverride||SEC[b.s].ask,prompt,opts:b.o,a:b.a,fixed:keepOrder,label:strip(q),sayAfter:sayA};
}
function buildTest(){
  const secs=activeSecs();
  if(S.count==="dc"){ return DC.filter(b=>secs.includes(b.s)).sort((x,y)=>SEC_ORDER.indexOf(x.s)-SEC_ORDER.indexOf(y.s)||x.idx-y.idx).map(b=>toQ(b,true)); }
  const pool=k=> k==="vocab" ? WORDS.map(w=>({s:"vocab",w,src:"ex"})) : DC.filter(b=>b.s===k).concat(EX.filter(b=>b.s===k));
  const N=+S.count, tw=secs.reduce((a,k)=>a+SEC[k].w,0), want={};
  const raw=secs.map(k=>({k,v:N*SEC[k].w/tw})); raw.forEach(r=>want[r.k]=Math.min(Math.floor(r.v),pool(r.k).length));
  let left=N-secs.reduce((a,k)=>a+want[k],0), g=0;
  raw.sort((x,y)=>(y.v%1)-(x.v%1));
  while(left>0&&g++<200){ let mv=false; for(const r of raw){ if(left>0&&want[r.k]<pool(r.k).length){want[r.k]++;left--;mv=true;} } if(!mv) break; }
  const qs=[];
  secs.forEach(k=>{ let pick=shuffle(pool(k)).slice(0,want[k]); if(k==="read") pick.sort((x,y)=>x.psg-y.psg||x.idx-y.idx); pick.forEach(b=>qs.push(toQ(b,k==="read"))); });
  return qs;
}

/* game */
let G=null,tmr=null;
function startGame(list){
  const qs=list||buildTest();
  qs.forEach(q=>{ q.answered=false; q._moved=false; q.ok=null; delete q.state; delete q.order; delete q.typed; });
  G={t0:Date.now(),qs,i:0,correct:0,streak:0,best:0,done:false,review:!!list,mode:S.count};
  show("game"); renderQ();
}
$("#startBtn").onclick=()=>{ if(!activeSecs().length) return;
  const nm=$("#stName"); if(!nm.value.trim()){ nm.classList.add("need"); nm.focus(); $("#bestNote").textContent="Em nhập họ tên trước khi làm bài để cô nhận được kết quả nhé."; return; }
  nm.classList.remove("need"); store.set("tv6-who",{name:nm.value.trim(),cls:$("#stClass").value.trim()}); startGame(); };
function renderQ(){
  const q=G.qs[G.i], n=G.qs.length;
  $("#fill").style.width=(G.i/n*100)+"%"; $("#runner").style.left=(G.i/n*100)+"%";
  $("#qnum").textContent=`Câu ${G.i+1}/${n}`;

  if(q.t==="mc"){
    $("#prompt").innerHTML=q.prompt;
    if(!q.order) q.order=q.fixed?q.opts.map((_,i)=>i):shuffle(q.opts.map((_,i)=>i));
    $("#answerArea").innerHTML=`<div class="opts">`+q.order.map((oi,i)=>`<button class="opt" data-i="${i}"><span class="k">${LET[i]}</span><span>${q.opts[oi]}</span></button>`).join("")+`</div>`;
    $("#answerArea").querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.i));
    if(q.sayFirst) say(q.sayFirst);
    startTimer(q.s==="read"?60:30);
  } else if(q.t==="type"){
    $("#prompt").innerHTML=q.prompt;
    $("#answerArea").innerHTML=`<div class="typebox"><input id="typeIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${q.pre?"":"Gõ câu trả lời…"}" value="${q.pre?q.pre+" ":""}"><button class="btn primary" id="checkBtn" style="font-size:19px;padding:10px 20px">Kiểm tra</button></div>`;
    const inp=$("#typeIn"); inp.focus({preventScroll:true}); inp.setSelectionRange(inp.value.length,inp.value.length);
    $("#checkBtn").onclick=()=>checkType(q);
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); e.stopPropagation(); if(!q.answered) checkType(q); else next(); } });
    startTimer(q.s==="rewrite"?90:45);
  } else { renderOrder(q); startTimer(60); }
}
function choose(i){
  const q=G.qs[G.i]; if(q.answered||i>=q.order.length) return;
  const ok=q.order[i]===q.a;
  document.querySelectorAll(".opt").forEach((b,j)=>{ b.disabled=true; if(q.order[j]===q.a) b.classList.add("right"); else if(j===i) b.classList.add("wrong"); else b.classList.add("dim"); });
  const bl=[...document.querySelectorAll(".blank")]; if(bl.length){ const parts=strip(q.opts[q.a]).split(/\s*\/\s*/); bl.forEach((x,k)=>x.textContent=parts[Math.min(k,parts.length-1)]); }
  resolve(ok);
}
function checkType(q){
  const inp=$("#typeIn"); const v=inp.value.trim();
  if(!v || (q.pre && norm(v)===norm(q.pre))){ inp.focus(); return; }
  q.typed=v;
  const ok=q.ans.some(a=>norm(a)===norm(v));
  inp.classList.add(ok?"right":"wrong"); inp.readOnly=true; $("#checkBtn").disabled=true;
  if(q.s==="verb"){ const bl=document.querySelector(".blank"); if(bl) bl.textContent=q.ansText; }
  resolve(ok);
}
function renderOrder(q){
  q.state=q.state||{placed:[],pool:(()=>{ const id=q.b.w.map((_,i)=>i); let s=shuffle(id),t=0; while(s.join()===id.join()&&t++<10) s=shuffle(id); return s; })()};
  $("#prompt").innerHTML=q.b.vi?`<p class="vi-hint">“${q.b.vi}”</p>`:"";
  drawOrder(q);
}
function drawOrder(q){
  const st=q.state,w=q.b.w, cap=(t,p)=>p===0?t.charAt(0).toUpperCase()+t.slice(1):t;
  $("#answerArea").innerHTML=`<div class="build" id="build">${st.placed.map((wi,p)=>`<button class="chunk placed" data-p="${p}">${cap(w[wi],p)}</button>`).join("")}${st.placed.length===w.length?`<b style="font-size:22px">${q.b.end}</b>`:""}</div>
    <div class="chunks">${st.pool.map(wi=>`<button class="chunk ${st.placed.includes(wi)?"used":""}" data-w="${wi}">${w[wi]}</button>`).join("")}</div>
    <div class="spellbar"><button class="btn" id="clearBtn">↺ Xóa hết</button></div>`;
  document.querySelectorAll(".chunk[data-w]").forEach(b=>b.onclick=()=>{ if(q.answered) return; const wi=+b.dataset.w; if(st.placed.includes(wi)) return; st.placed.push(wi); drawOrder(q); checkOrder(q); });
  document.querySelectorAll(".chunk[data-p]").forEach(b=>b.onclick=()=>{ if(q.answered) return; st.placed.splice(+b.dataset.p,1); drawOrder(q); });
  $("#clearBtn").onclick=()=>{ if(q.answered) return; st.placed=[]; drawOrder(q); };
}
function checkOrder(q){
  const st=q.state; if(st.placed.length<q.b.w.length) return;
  const got=st.placed.map(i=>q.b.w[i]).join(" ").toLowerCase();
  const ok=[q.b.w,...(q.b.alts||[])].some(a=>a.join(" ").toLowerCase()===got);
  $("#build").classList.add(ok?"right":"wrong"); document.querySelectorAll(".chunk,#clearBtn").forEach(b=>b.disabled=true); resolve(ok);
}
function rightText(q){ return q.t==="mc"?strip(q.opts[q.a]):q.ansText; }
function resolve(ok,timeout=false){
  const q=G.qs[G.i]; if(q.answered) return; q.answered=true; q.ok=ok; stopTimer(); beep(ok);
  if(ok){ G.correct++; G.streak++; G.best=Math.max(G.best,G.streak); } else G.streak=0; hud();
  const exLine=q.ex?`<span class="ex">💡 ${q.ex}</span>`:"";
  const head = ok ? `<span>✓ Chính xác!</span>` : `<span>${timeout?"⏰ Hết giờ!":"✗ Chưa đúng."} Đáp án: <b>${rightText(q)}</b></span>`;
  $("#feedback").innerHTML=`<div class="feedback ${ok?"ok":"no"}">${head}<button class="btn" id="nextBtn">${G.i===G.qs.length-1?"Xem kết quả":"Câu tiếp"}</button>${exLine}</div>`;
  $("#nextBtn").onclick=next; if(q.t!=="type") $("#nextBtn").focus({preventScroll:true});
  if(q.sayAfter) say(q.sayAfter);
}
function next(){ if(!G||G.done) return; const q=G.qs[G.i]; if(!q.answered||q._moved) return; q._moved=true; G.i++; if(G.i>=G.qs.length) finish(); else renderQ(); }
function hud(){ $("#score").textContent=`✓ ${G.correct}`; $("#streak").textContent=G.streak>=2?"🔥"+G.streak:""; }
function startTimer(sec){ stopTimer(); $("#timer").classList.toggle("hidden",!S.timer); if(!S.timer) return;
  G.total=sec*10; G.left=G.total; const bar=$("#timerBar"),box=$("#timer"); bar.style.width="100%"; box.classList.remove("low");
  tmr=setInterval(()=>{ G.left--; bar.style.width=(G.left/G.total*100)+"%"; if(G.left<G.total*.3) box.classList.add("low"); if(G.left<=0){ stopTimer(); timeUp(); } },100); }
function stopTimer(){ if(tmr){ clearInterval(tmr); tmr=null; } }
function timeUp(){ const q=G.qs[G.i]; if(q.answered) return;
  document.querySelectorAll(".opt").forEach((b,j)=>{ b.disabled=true; if(q.order&&q.order[j]===q.a) b.classList.add("right"); else b.classList.add("dim"); });
  document.querySelectorAll(".chunk,#clearBtn,#checkBtn").forEach(b=>b.disabled=true); const inp=$("#typeIn"); if(inp){ inp.readOnly=true; q.typed=inp.value; }
  resolve(false,true); }

  sendResult({
    _subject:`[Giữa kì 6] ${who.name||"(chưa nhập tên)"} – ${who.cls||"?"} – ${grade}/10`, _template:"table", _captcha:"false",
    "Học sinh":who.name||"(chưa nhập tên)","Lớp":who.cls||"","Bài":"Ôn thi giữa kì I – "+modeName,
    "Điểm":`${grade}/10`,"Số câu đúng":`${G.correct}/${n}`,
    "Từng phần":SEC_ORDER.filter(k=>per[k]).map(k=>`${SEC[k].n}: ${per[k][0]}/${per[k][1]}`).join("; "),
    "Thời gian làm":Math.floor(secs/60)+" phút "+(secs%60)+" giây",
    "Câu sai":wrong.length?wrong.map(q=>`[${SEC[q.s].n}] ${q.label}${q.typed?" (em viết: "+q.typed+")":""} → ${rightText(q)}`).join(" | "):"Không sai câu nào",
    "Lúc nộp":new Date().toLocaleString("vi-VN")
  });
}

/* misc */
document.addEventListener("click",e=>{ const b=e.target.closest("[data-say]"); if(b) say(b.dataset.say); });
document.addEventListener("keydown",e=>{
  if($("#game").classList.contains("hidden")||!G||e.target.id==="typeIn") return;
  const q=G.qs[G.i];
  if(q.answered){ if(e.key==="Enter"){ e.preventDefault(); next(); } return; }
  if(q.t==="mc"){ const k=e.key.toLowerCase(); const i="abcd".indexOf(k)>=0?"abcd".indexOf(k):(/^[1-4]$/.test(k)?+k-1:-1); if(i>=0) choose(i); }
});
setSoundIcon();
if(canSpeak){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice;
  $("#voiceSel").onchange=e=>{ enVoice=allVoices.find(v=>v.name===e.target.value)||enVoice; store.set("tv6-voice",enVoice&&enVoice.name); say("Hello! Welcome to my new school."); };
  $("#voiceTest").onclick=()=>say("Hello! This is my house. My best friend is very kind.");
} else $("#voiceGroup").classList.add("hidden");
(()=>{ const w=store.get("tv6-who"); if(w){ $("#stName").value=w.name||""; $("#stClass").value=w.cls||""; } })();
$("#stName").addEventListener("input",e=>e.target.classList.remove("need"));
refreshSetup();
</script>
</body>
